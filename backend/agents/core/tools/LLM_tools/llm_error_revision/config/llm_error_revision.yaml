# =============================================================================
# LLM 错误修订工具配置文件
# =============================================================================
# 用于控制 LLMErrorRevision 的 LLM 参数和默认提示词模板
# 修改此文件后无需修改 Python 代码即可调整修订行为
#
# 使用场景：在 LLM 生成结构化数据后，自动检测和修复遗漏/错误，
# 通过 Step A（修订）和 Step B（验收）的循环机制，确保输出数据的完整性。
# =============================================================================

agent_id: "llm_error_revision"
agent_name: "LLM错误修订器"
agent_description: "基于LLM的通用错误修订工具，通过循环修订确保数据质量"

# =============================================================================
# Step A: 修订提示词模板
# =============================================================================
# 用于指导 LLM 根据问题描述修复数据
# 支持变量占位符：
#   {step_a_prompt}  = 调用方传入的修订问题描述（必填）
#   {current_data}   = 当前待修订的数据（JSON格式）
#   {remaining_issues} = 上一轮验收发现的问题（首轮为空）
# =============================================================================
step_a_system_prompt: |
  你是一个数据修复专家。你的任务是根据提供的问题描述修复数据。

  【修复原则】
  1. 只修复问题描述中指出的问题，不要修改正确的部分
  2. 保持原有数据的结构和格式不变

  【输出要求】
  - 直接返回修复后的 JSON 数据
  - 不要包含任何额外的说明文字
  - 确保返回的是完整的 JSON 数据（不是补丁）

# =============================================================================
# Step B: 验收提示词模板
# =============================================================================
# 用于指导 LLM 检查修订后的数据是否达标
# 支持变量占位符：
#   {step_b_prompt}  = 调用方传入的达标标准描述（必填）
#   {revised_data}   = 修订后的数据（JSON格式）
# =============================================================================
step_b_system_prompt: |
  你是一个数据质量检查员。你的任务是根据验收标准检查数据是否合格。

  【检查原则】
  1. 严格按照验收标准逐项检查
  2. 关注数据的完整性、格式正确性和逻辑一致性
  3. 对每个问题给出具体的位置和描述

  【输出格式要求】（严格遵守 JSON 格式）
  {{
    "is_valid": true/false,
    "remaining_issues": [
      {{
        "type": "问题类型",
        "location": "问题位置（如 VTS名称.SSTS参数.db_key）",
        "description": "问题描述",
        "severity": "high/medium/low"
      }}
    ],
    "score": 0-100
  }}

  注意：
  - is_valid 为 true 表示所有验收标准已满足
  - remaining_issues 列出所有未解决的问题
  - score 给出整体质量评分

# =============================================================================
# LLM 参数配置
# =============================================================================
# 与 LLM_step.yaml 保持一致的默认 LLM 配置
llm_config:
  # 模型名称
  model_name: "qwen3.5-plus"
  # 单次调用的最大 token 数
  max_new_tokens: 20000
  # 温度
  temperature: 0.3
  # top_p：核采样
  top_p: 0.9
  # 存在惩罚
  presence_penalty: 1.0
  # 上下文窗口
  context_window: 256000
  # 输出格式
  output_format: "json"

# =============================================================================
# 修订循环配置
# =============================================================================
revision_config:
  # 最大重试次数（防止死循环）
  max_retries: 3
  # 首次通过优化（第一次就通过则直接返回）
  first_pass_optimization: true
  # 解析失败处理（JSON解析失败时的行为）
  parse_error_handling: "retry"  # retry | abort
