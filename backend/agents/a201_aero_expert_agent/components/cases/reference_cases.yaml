cases:
- id: A_electric_sedan_cd
  title: A级电动轿车风阻优化
  category: 电动车风阻优化
  description: 在开发初期即将风阻和能耗作为重点性能指标，风阻开发获得了造型部门的积极配合，并且获得了较多的风洞测试资源。
  vehicle_type: A+级、纯电动、sedan(轿车)
  key_params: Cd=0.208, 迎风面积=2.33m², 长*宽*高(mm)=4785*1896*1445
  results: '1.在中国汽车工程院重庆风洞中心进行了7轮风洞测试开发（5轮油泥模型+2轮样车），试验时间总结约65h。

    2.早期的油泥风洞测试中，通过造型的探索 Cd最小值≈0.19。这基本上可以作为类似尺寸车型的Cd的工程极限值，也就是在满足其他性能工程限制的前提下能达到的最小Cd值。

    3.最终经过样车测试，Cd=0.208'
  source: 个人经验
  created_at: '2026-10-17 07:47:38'
  updated_at: '2026-10-17 07:47:38'
