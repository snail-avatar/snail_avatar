rules:
- id: curb_mass_estimate
  name: 整备质量预估
  category: 经验数据
  description: '1.本评估方法，用于在项目最初阶段，进行整备质量的初步估算。

    2.基本的评估方式为，根据轴距（mm）、电池电量（kwh）和是否为四驱三个因素，粗略的评估整备质量的合理值；

    3.轴距系数代号 k_wb，单位kg/mm，物理意义为单位轴距对应的整备质量。根据车身形式（sdean或者SUV）和动力形式（纯电/混动）的差异取不同的系数。

    4.电量系数代号 k_eng，单位kg/kwh，物理一以为单位电量对应的整备质量。根据动力形式（纯电/混动）的差异取不同的系数。

    5.驱动形式常数代号 delta_drv，单位kg，物理意义为相对于两驱系统，四驱系统的质量增加量，两驱系统 delta_drv=0kg ；四驱系统 delta_drv=90kg
    。'
  formula: 'curb_mass=wb*k_wb+eng*k_eng+delta_drv

    其中：

    curb_mass 为整备质量，单位kg

    wb 为轴距，单位mm

    k_wb 为轴距系数，单位kg/mm；sedan纯电车型 k_wb=0.485；sedan混动/增程车型  k_wb=0.535

    eng 为电池标称电量，单位kwh

    k_eng 为电量系数，单位kg/kwh；纯电车型 k_eng=6.2 ；混动/增程车型  k_eng=7.1'
  source: 开发经验
  created_at: '2026-10-17 22:00:11'
  updated_at: '2026-10-17 22:00:11'
- id: Mot_Eff
  name: 电驱平均效率预估
  category: 经验数据
  description: 电驱搭载到某车辆后，在进行某特定驾驶循环行驶的过程中，电驱动系统（包括电机、控制器和减速器在内）表现出来的平均效率。可以按照电驱工作在驱动模式还是能量回收模式，进一步分解为“电驱驱动平均效率”和“电驱回收平均效率”
  formula: 'Mot_Eff=(Mot_Div_Eff+Mot_Reg_Eff)/2

    其中：

    Mot_Eff 为电驱平均效率，单位1

    Mot_Div_Eff 为电驱驱动平均效率，单位1；对于永磁同步电驱，取值范围为 0.88-0.935。

    Mot_Reg_Eff 为电驱回收平均效率，单位1；一般略＜Mot_Div_Eff；对于永磁同步电驱，取值范围为 0.87-0.93。'
  source: 开发经验
  created_at: '2026-10-17 22:00:11'
  updated_at: '2026-10-17 22:00:11'
- id: Bat_Eff
  name: 电池充放电效率
  category: 经验数据
  description: 电池充放电效率，指用在经济性循环测试中电池的放电能量，同用慢充（一般＜1/3C充电电流）进行的电池充电能量的比值，单位为1。用于描述电池在经济性测试工况下，电池的充/放电效率。
  formula: 锂离子电池的充放电效率一般取值范围为0.92-0.97。
  source: 开发经验
  created_at: '2026-10-17 22:00:11'
  updated_at: '2026-10-17 22:00:11'
- id: M_B_Energy
  name: 机械制动能耗比例预估
  category: 经验数据
  description: '1.“机械制动能耗比例”物理意义为，机械制动系统消耗掉的能量和能量回收、机械制动消耗的总制动能量的比值。它用于描述车辆对应某个驾驶循环的能量回收系统的效率，值越接近于0，说明能量回收系统效率越高。对于没有能量回收功能的车辆，机械制动能耗比例=1。

    2.“机械制动能耗比例”主要受能量回收形式的影响。

    3.串联能量回收系统，指能量回收系统和机械制动系统解耦，可以优先进行能量回收的系统，是目前的主流方式。

    4.并联能量回收系统，指能量回收系统和机械制动系统无法解耦，驾驶员踩下制动踏板后，两个系统同时动作；其对原制动系统的改造规模小、成本低，一般应用在售价<5万RMB或者早期的油改电车型；其能量回收效果较差。'
  formula: '1.对于纯电动车型，一般应用CLTC循环：串联能量回收系统 M_B_Energy≈0.02-0.05；并联能量回收系统 M_B_Energy≈0.1-0.2；以串联能量回收为主，只有售价小于5万的超低成本车型考虑并联回收方案。

    2.对于增程或者混动车型，一般应用WLTC循环：串联能量回收系统 M_B_Energy≈0.03-0.06；并联能量回收系统 M_B_Energy≈0.13-0.23；以串联能量回收为主，只有售价小于5万的超低成本车型考虑并联回收方案。'
  source: 开发经验
  created_at: '2026-10-17 22:00:11'
  updated_at: '2026-10-17 22:00:11'
- id: low_voltage_power
  name: 低压功耗
  category: 经验数据
  description: '这里的低压功耗，指在经济性测试工况下，低压系统的平均功率。

    '
  formula: '1.典型电动车低压功耗范围为，110~400w；

    2.其中智能驾驶系统是重要的变量。对于一般的低价车型（仅有部分辅助驾驶功能）的车型，低压功耗范围为，110-200w；

    3.对于强智驾系统的车型来说，智驾系统一般会额外产生150-250w的功率。

    4.对于混动或者增程车型，发动机启动后，额外产生约70-90w功率。'
  source: 开发经验
  created_at: '2026-10-17 22:00:11'
  updated_at: '2026-10-17 22:00:11'
- id: EDU_tmax
  name: 电驱轮端峰值扭矩
  category: 经验数据
  description: 经过减速器的作用后，电驱系统能输出的最大扭矩，决定车辆的加速性能
  formula: 对于主流的新能源车型，EDU_tmax≈4000-5500 Nm
  source: ''
  created_at: '2026-10-17 22:00:11'
  updated_at: '2026-10-17 22:00:11'
- id: EDU_spd_max
  name: 电驱轮端峰值转速
  category: 经验数据
  description: 经过减速器的作用后，电驱系统能输出的最大转速，影响车辆的最高车速
  formula: 对于主流的新能源车型，EDU_spd_max≈1400-1600 rpm
  source: ''
  created_at: '2026-10-17 22:00:11'
  updated_at: '2026-10-17 22:00:11'
- id: Rad
  name: 轮胎滚动半径
  category: 计算公式
  description: 车轮动态滚动的等效半径；工程上可以由轮胎规格（如 235/55 R18）计算得到
  formula: "假设子午线轮胎规格为：\"断面宽度 B （单位mm）\"/\"扁平比 AR （单位%）\" R\"轮辋直径 Dr(单位英寸)\"。例如 235/55\
    \ R18 轮胎断面宽度 B=235mm，扁平比 AR=55%，轮辋直径 Dr=18英寸。\n则，轮胎滚动半径的计算方法为：Rad=0.971*(12.7*Dr+B*AR)\
    \ 单位mm \n例如：235/55 R18 轮胎，滚动半径Rad=0.971*(12.7*18+235*55%)≈347mm"
  source: ''
  created_at: '2026-10-17 22:00:11'
  updated_at: '2026-10-17 22:00:11'
- id: Brake_Res
  name: 制动钳阻力矩
  category: 经验数据
  description: 制动盘在旋转过程中，由于卡钳和制动盘脱离不完全产生的摩擦扭矩；在动力、经济性计算中，是传动系统内阻的重要组成部分。
  formula: 对于主流乘用车，Brake_Res≈1-2 Nm
  source: ''
  created_at: '2026-10-17 22:00:11'
  updated_at: '2026-10-17 22:00:11'
- id: Bearing_Res
  name: 轮毂轴承阻力矩
  category: 经验数据
  description: 轴承旋转过程的摩擦扭矩；在动力、经济性计算中，是传动系统内阻的一部分。
  formula: 对于主流乘用车，Brake_Res≈0.5-1 Nm
  source: ''
  created_at: '2026-10-17 22:00:11'
  updated_at: '2026-10-17 22:00:11'
