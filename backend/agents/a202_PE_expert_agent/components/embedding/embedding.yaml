# embedding 配置文件

provider: dashscope
model: "qwen3-vl-embedding"
dimension: 2048

batch:
  max_text_length: 32000
  batch_size: 4
  rpm_limit: 2400
  tpm_limit: 1200000

document_processor:
  max_chunk_size: 2000
  ocr_lang: "chi_sim+eng"
  scanned_threshold: 100
  scanned_check_pages: 3

vector_store:
  persist_dir: "../../data/vector_db"
  collection_name: "pe_docs"

data_dir: "../../data"
