# =============================================================================
# 步骤（3）：车型总结 - LLM配置
# =============================================================================
# 此步骤对多个循环中的 step2_7 结果进行总结，作为整个 process 的结果输出
# 采用两阶段调用：阶段1 分析总结 (text)，阶段2 不启用

step_type: "llm"
step_id: "FINAL_SUMMARY"
step_name: "车型总结"

# 启用阶段1进行总结分析，关闭阶段2的JSON格式化
stage1_enabled: true
stage2_enabled: false

# =============================================================================
# 数据源声明（data_sources）
# =============================================================================
# 读取所有专业的 step2_7 总结结果

data_sources:
  # 读取所有专业的总结结果
  # 对应私有函数：get_all_category_summaries（文件：a101_step3_get_all_summaries.py）
  # 功能：从沙箱中读取所有专业的 SUMMARIZE_CATEGORY 步骤结果
  - function: "get_all_category_summaries"
    args_mapping:
      sandbox: "$sandbox"
    output: "all_category_summaries"

# =============================================================================
# 后置操作（post_process）
# =============================================================================
# 步骤执行完成后，保存最终总结为 process 输出

post_process:
  - function: "save_final_summary"
    args_mapping:
      sandbox: "$sandbox"
      result: "$result"

# =============================================================================
# Prompt 模板
# =============================================================================

prompt_template: |
  【车型信息】
  车型后缀：{vehicle_suffix}
  车型名称：{vehicle_display_name}

  【各专业总结汇总】
  {all_category_summaries}

# =============================================================================
# 阶段 1: 分析总结 (text模式)
# =============================================================================

stage1_system_prompt: |
  你是目标值定义最终总结专家，负责总结所有专业的指标定义结论。

  【工作模式】
  根据各专业的总结结果，进行整车层面的汇总：
  1. 汇总各专业的定义情况
  2. 分析整体达标情况
  3. 总结优化情况和关键结论
  4. 评估参数置信度

  【输出要求】
  用结构化文本清晰描述，不需要输出 JSON 格式。
  重点说明决策逻辑、关键结论和置信度评估。

# stage1_llm_config: 阶段1配置
stage1_llm_config:
  model_name: "qwen3.5-plus"
  max_new_tokens: 4000
  temperature: 0.3
  top_p: 0.9
  presence_penalty: 1.0
  context_window: 256000
  output_format: "text"
