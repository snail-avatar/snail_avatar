# =============================================================================
# 增程电动车经济性计算流程拓扑定义
# =============================================================================
# 【此文件唯一职责】定义DAG拓扑连接关系
# 参照：计算工作流说明文档.txt
#
# 原则：分离关注点
#   - 本文件 = 节点依赖关系 + UI布局位置
#   - 节点元数据(inputs/outputs) = node_X_xxx.yaml（单一真相源）
# =============================================================================
workflow_id: "REEV_ECO_CALC"
workflow_name: "增程电动车经济性计算流程"
version: "2.0.0"
description: "增程电动汽车经济性完整计算流程，约定优于配置架构"

# 计算类型标识（用于匹配车型配置）
calculation_type: "economy"  # 经济性计算
energy_type: "reev"          # 能源形式

# =============================================================================
# 拓扑节点列表（只存连接关系，元数据在对应node_X_xxx.yaml）
# =============================================================================
nodes:
  node_0_Cd_wt_calculator:
    upstream: []
  
  node_1_DriveCycleAnalyzer:
    upstream: []
  
  node_2_ResistanceCalculator:
    upstream: ["node_0_Cd_wt_calculator", "node_1_DriveCycleAnalyzer"]
  
  node_2A_MotorWorkpoint:
    upstream: ["node_2_ResistanceCalculator"]
  
  node_3_WheelEnergy:
    upstream: ["node_2_ResistanceCalculator"]

  node_4_EDUEnergy:
    upstream: ["node_3_WheelEnergy"]

  node_5_EVEnergyConsumption:
    upstream: ["node_1_DriveCycleAnalyzer", "node_4_EDUEnergy"]

  node_6_REEVEnergyConsumption:
    upstream: ["node_1_DriveCycleAnalyzer", "node_5_EVEnergyConsumption"]
